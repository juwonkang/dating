<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>투슬리스의 데이트 신청 🐉</title>
<meta property="og:title" content="투슬리스가 데이트 신청했어요 🐉">
<meta property="og:description" content="이번주 토요일, 같이 뭐 하고 놀지 골라줘!">
<style>
  :root{
    --bg-1:#0b1130;
    --bg-2:#1b2a56;
    --bg-3:#241542;
    --bg-4:#150a28;
    --ember:#ff9e6d;
    --ember-dark:#e8794a;
    --gold:#ffd873;
    --card:rgba(255,255,255,.08);
    --card-strong:rgba(255,255,255,.15);
    --text:#f6f3ff;
    --text-dim:#b7bfe8;
    --shadow:0 14px 34px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
    color:var(--text);
    background:
      radial-gradient(ellipse 120% 60% at 50% -10%, rgba(255,158,109,.12), transparent 60%),
      linear-gradient(180deg,var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 78%, var(--bg-4) 100%);
    overflow:hidden;
    min-height:100vh;
    min-height:100dvh;
  }
  .speech{font-weight:800;letter-spacing:.2px;}
  button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}
  button:focus-visible, a:focus-visible{outline:2px solid var(--gold); outline-offset:3px; border-radius:8px;}

  #stars{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.95}}

  #moon{position:fixed;top:7%;right:9%;width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff8e4, #ffe9b8 45%, rgba(255,233,184,0) 75%);
    box-shadow:0 0 46px 12px rgba(255,233,184,.22);z-index:0;pointer-events:none;}
  #mountains{position:fixed;left:0;right:0;bottom:0;z-index:0;pointer-events:none;line-height:0;}
  #mountains svg{width:100%;height:16vh;display:block;}

  #progress{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:40;}
  #progress .dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25);transition:background .3s, transform .3s;}
  #progress .dot.on{background:var(--gold);transform:scale(1.3);}

  #app{position:relative;width:100%;min-height:100vh;min-height:100dvh;z-index:1;}
  .page{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;
    padding:calc(env(safe-area-inset-top,0px) + 52px) 20px calc(env(safe-area-inset-bottom,0px) + 24px);
    opacity:0;pointer-events:none;transition:opacity .45s ease;
    overflow-y:auto;
    scroll-behavior:smooth;
  }
  .page.active{opacity:1;pointer-events:auto;}
  .page-inner{width:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center;flex:1;}

  .bubble{
    background:var(--card-strong);
    backdrop-filter:blur(6px);
    border-radius:24px;
    padding:18px 22px;
    text-align:center;
    box-shadow:var(--shadow);
    position:relative;
    max-width:340px;
    animation:popIn .5s ease;
  }
  .bubble:after{
    content:"";position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);
    border-width:14px 12px 0 12px;border-style:solid;
    border-color:var(--card-strong) transparent transparent transparent;
  }
  .bubble h1{margin:0;font-size:clamp(1.35rem,5.5vw,1.7rem);line-height:1.35;letter-spacing:.2px;}
  @keyframes popIn{from{opacity:0;transform:scale(.85) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}

  .dragon-wrap{width:min(62vw,250px);margin:26px auto 8px;filter:drop-shadow(0 12px 18px rgba(0,0,0,.35));animation:floatY 3.2s ease-in-out infinite;position:relative;}
  .dragon-wrap svg{width:100%;height:100%;display:block;position:relative;z-index:1;}
  .dragon-wrap::after{content:"";position:absolute;left:50%;bottom:0px;transform:translateX(-50%);width:52%;height:13px;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.5), transparent 72%);filter:blur(3px);z-index:0;}
  @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

  .btn-area{display:flex;gap:16px;margin-top:34px;position:relative;justify-content:center;flex-wrap:wrap;}
  .btn{
    min-height:52px;padding:14px 30px;border-radius:999px;font-weight:700;font-size:1rem;
    box-shadow:var(--shadow);transition:transform .15s ease, box-shadow .15s ease;
    position:relative;overflow:hidden;
  }
  .btn:active{transform:scale(.96);}
  .btn-primary{background:linear-gradient(135deg,var(--ember),var(--ember-dark));color:#fff;
    box-shadow:0 10px 24px rgba(232,121,74,.4), 0 2px 6px rgba(0,0,0,.3);}
  .btn-ghost{background:var(--card);color:var(--text);}
  .btn-yes.roaming{position:fixed;z-index:60;transition:left .4s cubic-bezier(.34,1.56,.64,1), top .4s cubic-bezier(.34,1.56,.64,1);}
  .btn:disabled{opacity:.35;pointer-events:none;}
  .btn-text{background:none;color:var(--text-dim);font-size:.83rem;text-decoration:underline;text-underline-offset:3px;padding:8px;min-height:auto;box-shadow:none;}
  .btn-text:disabled{opacity:.3;pointer-events:none;}
  .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rippleAnim .55s ease-out forwards;pointer-events:none;}
  @keyframes rippleAnim{to{transform:scale(2.4);opacity:0;}}

  .hint{margin-top:14px;font-size:.8rem;color:var(--text-dim);}

  #overlay-no{position:fixed;inset:0;background:rgba(4,4,10,.92);z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;opacity:0;pointer-events:none;transition:opacity .35s ease;text-align:center;padding:20px;}
  #overlay-no.show{opacity:1;pointer-events:auto;}
  #overlay-no h2{font-weight:800;font-size:clamp(2rem,10vw,3rem);margin:0;animation:shake .5s ease;}
  #overlay-no p{color:var(--text-dim);margin:0;max-width:280px;font-size:.9rem;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}

  .popup-overlay{position:fixed;inset:0;background:rgba(4,4,10,.6);z-index:80;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s ease;padding:20px;}
  .popup-overlay.show{opacity:1;pointer-events:auto;}
  .popup-card{background:var(--bg-2);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:30px 26px;text-align:center;max-width:300px;box-shadow:var(--shadow);animation:popIn .3s ease;}
  .popup-card h3{font-weight:800;font-size:1.5rem;margin:0 0 6px;}
  .popup-card .choice{color:var(--gold);font-weight:700;margin:0 0 20px;font-size:.95rem;}
  .popup-actions{display:flex;flex-direction:column;gap:10px;align-items:center;}

  h2.title{font-size:clamp(1.15rem,5vw,1.4rem);text-align:center;margin:6px 0 4px;}
  .subtitle{color:var(--text-dim);font-size:.85rem;text-align:center;margin:0 0 20px;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-top:6px;}
  @media (max-width:360px){.grid{grid-template-columns:1fr;}}
  .chip{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    min-height:84px;padding:12px 10px;border-radius:18px;
    background:var(--card);border:1.5px solid rgba(255,255,255,.08);
    font-size:.86rem;font-weight:500;text-align:center;line-height:1.3;
    transition:transform .15s ease, background .2s ease, border-color .2s ease;
  }
  .chip .emoji{font-size:1.6rem;}
  .chip:active{transform:scale(.95);}
  .chip.selected{background:linear-gradient(135deg,rgba(255,158,109,.35),rgba(255,216,115,.25));border-color:var(--gold);}
  .chip.grabbed{opacity:.45;transform:scale(.9);}

  #page-food .page-inner{padding-bottom:110px;}
  .sticky-cta{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:14px 20px calc(env(safe-area-inset-bottom,0px) + 16px);background:linear-gradient(180deg,transparent,var(--bg-4) 55%);z-index:30;transition:opacity .3s ease, transform .3s ease;}
  .sticky-cta.hidden{opacity:0;transform:translateY(16px);pointer-events:none;}
  .sticky-cta .btn{width:100%;max-width:400px;}

  .flying-dragon{position:fixed;width:56px;height:56px;pointer-events:none;z-index:90;opacity:0;transition:left .5s cubic-bezier(.4,0,.2,1), top .5s cubic-bezier(.4,0,.2,1), opacity .3s ease;}
  .flying-dragon.show{opacity:1;}
  .flying-dragon svg{animation:flap .5s ease-in-out infinite alternate;}
  @keyframes flap{0%{transform:rotate(-10deg)}100%{transform:rotate(10deg)}}

  .thinking{display:flex;align-items:center;gap:6px;margin-top:18px;opacity:0;transition:opacity .25s ease;scroll-margin:80px;}
  .thinking.show{opacity:1;}
  .thinking span.dot-b{width:9px;height:9px;border-radius:50%;background:var(--gold);animation:dotBounce 1.1s ease-in-out infinite;}
  .thinking span.dot-b:nth-child(2){animation-delay:.15s;}
  .thinking span.dot-b:nth-child(3){animation-delay:.3s;}
  @keyframes dotBounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-6px);opacity:1}}

  .result-box{margin-top:18px;text-align:center;display:none;scroll-margin:80px;}
  .result-box.show{display:flex;flex-direction:column;align-items:center;gap:10px;animation:popIn .4s ease;}
  .result-box .food-pick{font-size:1.1rem;font-weight:700;color:var(--gold);margin:6px 0 4px;}

  .final-dragons{display:flex;align-items:flex-end;justify-content:center;margin:20px 0 6px;}
  .final-dragons .dragon-wrap{width:min(36vw,150px);margin:0;animation:floatY 3.4s ease-in-out infinite;}
  .final-dragons .dragon-wrap.lean-l{transform:rotate(-4deg);margin-right:-18px;}
  .final-dragons .dragon-wrap.lean-r{transform:rotate(4deg);margin-left:-18px;animation-delay:.4s;}

  #fx{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden;}
  .heart{position:absolute;bottom:-40px;font-size:1.4rem;animation:riseHeart 4s ease-in forwards;}
  @keyframes riseHeart{0%{transform:translateY(0) scale(.7);opacity:0}10%{opacity:1}100%{transform:translateY(-92vh) scale(1.15);opacity:0}}
  .confetti{position:absolute;width:7px;height:11px;border-radius:2px;animation:confettiFly .85s cubic-bezier(.2,.8,.3,1) forwards;}
  @keyframes confettiFly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0;}}

  .recap{background:var(--card);border-radius:20px;padding:18px 20px;margin-top:14px;width:100%;text-align:center;font-size:.92rem;line-height:1.6;}
  .recap b{color:var(--gold);}

  .final-actions{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:18px;width:100%;}
  .final-actions .btn-primary{width:100%;max-width:300px;}
  .replay-link{margin-top:4px;background:none;color:var(--text-dim);font-size:.78rem;text-decoration:underline;text-underline-offset:3px;}

  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:rgba(18,16,28,.94);color:#fff;
    padding:12px 20px;border-radius:14px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .3s ease, transform .3s ease;
    z-index:100;max-width:82vw;text-align:center;box-shadow:var(--shadow);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  }
</style>
</head>
<body>

<div id="stars"></div>
<div id="moon"></div>
<div id="mountains">
  <svg viewBox="0 0 400 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,100 L0,66 L35,80 L75,42 L115,72 L165,28 L210,74 L255,46 L300,76 L345,52 L400,70 L400,100 Z" fill="#0d0a22" opacity=".92"/>
  </svg>
</div>
<div id="fx"></div>
<div id="progress">
  <span class="dot" data-p="intro"></span>
  <span class="dot" data-p="style"></span>
  <span class="dot" data-p="food"></span>
  <span class="dot" data-p="time"></span>
  <span class="dot" data-p="final"></span>
</div>

<div id="app">

  <section class="page active" id="page-intro">
    <div class="page-inner" style="justify-content:center;">
      <div class="bubble speech"><h1>나랑 데이트 할래요?</h1></div>
      <div class="dragon-wrap dragon-toothless" id="dragon-intro"></div>
      <div class="btn-area">
        <button class="btn btn-primary btn-yes" id="btn-yes">예</button>
        <button class="btn btn-ghost" id="btn-no">아니요</button>
      </div>
      <p class="hint">신중하게 골라주세요...</p>
    </div>
  </section>

  <section class="page" id="page-style">
    <div class="page-inner">
      <h2 class="title">토요일엔 뭐 하면서 놀고 싶나요?</h2>
      <p class="subtitle">끌리는 걸로 하나만 골라줘요 · 잘못 눌러도 취소할 수 있어요</p>
      <div class="grid" id="style-grid"></div>
    </div>
  </section>

  <section class="page" id="page-food">
    <div class="page-inner">
      <h2 class="title">먹고싶은 걸 눌러두세요</h2>
      <p class="subtitle">투슬리스가 골라줄게요 · 여러 개 골라도 돼요</p>
      <div class="grid" id="food-grid"></div>
      <div class="thinking" id="thinking">
        <span class="dot-b"></span><span class="dot-b"></span><span class="dot-b"></span>
        <span class="speech" id="thinking-label" style="margin-left:6px;font-size:.9rem;color:var(--text-dim);"></span>
      </div>
      <div class="result-box" id="result-box">
        <p class="speech" style="font-size:1.1rem;margin:0;">음... 오늘은</p>
        <p class="food-pick" id="food-pick-text"></p>
        <button class="btn btn-primary" id="btn-food-next">다음으로</button>
        <button class="btn-text" id="btn-food-reroll">다른 추천 볼래요 🔁</button>
      </div>
    </div>
    <div class="sticky-cta" id="sticky-cta">
      <button class="btn btn-primary" id="btn-ddanggyeo" disabled>땡겨요</button>
    </div>
  </section>

  <section class="page" id="page-time">
    <div class="page-inner">
      <h2 class="title">몇 시에 만날까요?</h2>
      <p class="subtitle">시간까지 정해야 진짜 약속이 되죠</p>
      <div class="grid" id="time-grid"></div>
    </div>
  </section>

  <section class="page" id="page-final">
    <div class="page-inner" style="justify-content:center;">
      <div class="bubble speech"><h1>이렇게 놀자! 💕</h1></div>
      <div class="final-dragons">
        <div class="dragon-wrap dragon-fury lean-l"></div>
        <div class="dragon-wrap dragon-toothless lean-r"></div>
      </div>
      <div class="recap" id="recap"></div>
      <div class="final-actions">
        <button class="btn btn-primary" id="btn-share">결과 공유하기 💌</button>
        <button class="replay-link" id="btn-replay">처음부터 다시 보기</button>
      </div>
    </div>
  </section>

</div>

<div id="overlay-no">
  <h2 class="speech">나 안 해! 😤</h2>
  <p>...라고 할 리가 없잖아요</p>
  <button class="btn btn-primary" id="btn-retry">한번만 더 기회 줄게</button>
</div>

<div class="popup-overlay" id="popup-confirm">
  <div class="popup-card">
    <h3 class="speech">이걸로 할까요?</h3>
    <p class="choice" id="popup-choice-label"></p>
    <div class="popup-actions">
      <button class="btn btn-primary" id="popup-confirm-btn">응, 이걸로!</button>
      <button class="btn-text" id="popup-cancel-btn">다른 거 볼래요</button>
    </div>
  </div>
</div>

<div class="flying-dragon dragon-toothless" id="flying-dragon"></div>
<div id="toast"></div>

<script>
(function(){
  "use strict";

  // 어떤 런타임 오류든 화면에 노출되지 않도록 조용히 무시
  window.addEventListener('error', function(e){ e.preventDefault(); }, true);
  window.addEventListener('unhandledrejection', function(e){ e.preventDefault(); });

  /* ---------- 캐릭터 일러스트 (원본 디자인) ----------
     실제 스틸컷은 저작권 때문에 그대로 못 넣지만, 색감·자세는 참고해서
     그라디언트 음영 + 하이라이트를 더한 오리지널 그림으로 다듬었어요.
     저장해둔 이미지를 직접 쓰고 싶다면 fillDragons() 안에서
     el.innerHTML = dragonSVG(...) 대신
     el.innerHTML = '<img src="원하는 이미지 경로" style="width:100%">'
     로 바꾸면 바로 적용돼요. */
  var dragonUid = 0;
  function dragonSVG(variant){
    var uid = 'dg'+(dragonUid++);
    var isFury = variant === 'fury';
    var g0 = isFury ? '#fbfaf5' : '#2b2b36';
    var g1 = isFury ? '#e6e0cf' : '#07070a';
    var belly = isFury ? '#fffdf6' : '#34343f';
    var iris = isFury ? '#8fd6f2' : '#7dffc9';
    var finAccent = isFury ? '#f3c9d8' : '#c2432f';
    return '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">'
      + '<defs><linearGradient id="'+uid+'" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0%" stop-color="'+g0+'"/><stop offset="100%" stop-color="'+g1+'"/>'
      + '</linearGradient></defs>'
      + '<path d="M40,150 Q6,168 10,188 Q34,182 60,155 Z" fill="url(#'+uid+')"/>'
      + '<path d="M8,178 Q2,190 14,196 Q20,186 18,176 Z" fill="'+finAccent+'"/>'
      + '<path d="M14,190 Q10,200 22,200 Q24,192 20,186 Z" fill="'+finAccent+'"/>'
      + '<path d="M58,78 Q14,44 8,98 Q44,98 72,110 Z" fill="url(#'+uid+')"/>'
      + '<path d="M62,86 Q40,74 30,92" stroke="rgba(0,0,0,.18)" stroke-width="2" fill="none"/>'
      + '<path d="M142,78 Q186,44 192,98 Q156,98 128,110 Z" fill="url(#'+uid+')"/>'
      + '<path d="M138,86 Q160,74 170,92" stroke="rgba(0,0,0,.18)" stroke-width="2" fill="none"/>'
      + '<path d="M96,34 L100,22 L104,34 Z" fill="url(#'+uid+')"/>'
      + '<path d="M89,45 L94,31 L100,45 Z" fill="url(#'+uid+')" opacity=".85"/>'
      + '<ellipse cx="100" cy="120" rx="58" ry="47" fill="url(#'+uid+')"/>'
      + '<ellipse cx="100" cy="136" rx="32" ry="23" fill="'+belly+'"/>'
      + '<ellipse cx="80" cy="98" rx="20" ry="12" fill="rgba(255,255,255,.14)"/>'
      + '<ellipse cx="66" cy="162" rx="16" ry="12" fill="url(#'+uid+')"/>'
      + '<ellipse cx="134" cy="162" rx="16" ry="12" fill="url(#'+uid+')"/>'
      + '<ellipse cx="100" cy="68" rx="44" ry="38" fill="url(#'+uid+')"/>'
      + '<ellipse cx="82" cy="52" rx="17" ry="10" fill="rgba(255,255,255,.16)"/>'
      + '<path d="M64,42 Q52,14 76,26 Q76,48 64,42Z" fill="url(#'+uid+')"/>'
      + '<path d="M136,42 Q148,14 124,26 Q124,48 136,42Z" fill="url(#'+uid+')"/>'
      + '<ellipse cx="80" cy="65" rx="16" ry="18" fill="#fff"/>'
      + '<ellipse cx="120" cy="65" rx="16" ry="18" fill="#fff"/>'
      + '<circle cx="82" cy="67" r="9.5" fill="'+iris+'"/>'
      + '<circle cx="118" cy="67" r="9.5" fill="'+iris+'"/>'
      + '<circle cx="82" cy="67" r="4.2" fill="#12181c"/>'
      + '<circle cx="118" cy="67" r="4.2" fill="#12181c"/>'
      + '<circle cx="85" cy="61.5" r="2.8" fill="#fff"/>'
      + '<circle cx="121" cy="61.5" r="2.8" fill="#fff"/>'
      + '<circle cx="90" cy="88" r="2.2" fill="rgba(0,0,0,.35)"/>'
      + '<circle cx="110" cy="88" r="2.2" fill="rgba(0,0,0,.35)"/>'
      + '<path d="M82,96 Q100,106 118,96" stroke="rgba(0,0,0,.35)" stroke-width="2.6" fill="none" stroke-linecap="round"/>'
      + '</svg>';
  }
  function fillDragons(){
    document.querySelectorAll('.dragon-toothless').forEach(function(el){ el.innerHTML = dragonSVG('toothless'); });
    document.querySelectorAll('.dragon-fury').forEach(function(el){ el.innerHTML = dragonSVG('fury'); });
  }
  fillDragons();

  /* ---------- 별 배경 ---------- */
  var starsEl = document.getElementById('stars');
  for(var i=0;i<44;i++){
    var s = document.createElement('div');
    s.className='star';
    var size = Math.random()*2.4+1;
    s.style.width=size+'px'; s.style.height=size+'px';
    s.style.left=(Math.random()*100)+'%';
    s.style.top=(Math.random()*70)+'%';
    s.style.animationDelay=(Math.random()*3)+'s';
    starsEl.appendChild(s);
  }

  /* ---------- 버튼 리플 ---------- */
  document.querySelectorAll('.btn:not(.btn-text)').forEach(function(b){
    b.addEventListener('click', function(e){
      var rect = b.getBoundingClientRect();
      var size = Math.max(rect.width, rect.height);
      var ripple = document.createElement('span');
      ripple.className='ripple';
      ripple.style.width = ripple.style.height = size+'px';
      var x = (e.clientX || rect.left+rect.width/2) - rect.left - size/2;
      var y = (e.clientY || rect.top+rect.height/2) - rect.top - size/2;
      ripple.style.left = x+'px'; ripple.style.top = y+'px';
      b.appendChild(ripple);
      setTimeout(function(){ ripple.remove(); }, 560);
    });
  });

  /* ---------- 페이지 전환 ---------- */
  var order = ['intro','style','food','time','final'];
  function goPage(id){
    order.forEach(function(p){
      var el = document.getElementById('page-'+p);
      el.classList.toggle('active', p===id);
      if(p===id) el.scrollTop = 0;
    });
    document.querySelectorAll('#progress .dot').forEach(function(d){
      d.classList.toggle('on', d.dataset.p===id);
    });
    if(id==='final'){ startHearts(); spawnConfettiBurst(); }
  }

  /* ---------- 예/아니요 (인트로) ---------- */
  var btnYes = document.getElementById('btn-yes');
  var btnNo = document.getElementById('btn-no');
  var overlayNo = document.getElementById('overlay-no');
  var btnRetry = document.getElementById('btn-retry');
  var yesStage = 0;
  var yesTexts = ['예','진짜요?','정말로...?'];

  function relocateYes(){
    var rect = btnYes.getBoundingClientRect();
    if(!btnYes.classList.contains('roaming')){
      btnYes.style.left = rect.left+'px';
      btnYes.style.top = rect.top+'px';
      btnYes.style.width = rect.width+'px';
      btnYes.classList.add('roaming');
    }
    var margin = 24;
    var maxLeft = Math.max(margin, window.innerWidth - btnYes.offsetWidth - margin);
    var maxTop = Math.max(margin+60, window.innerHeight - btnYes.offsetHeight - margin - 40);
    var newLeft = margin + Math.random()*(maxLeft-margin);
    var newTop = margin+60 + Math.random()*(maxTop-margin-60);
    requestAnimationFrame(function(){
      btnYes.style.left = newLeft+'px';
      btnYes.style.top = newTop+'px';
    });
  }

  function resetYesButton(){
    yesStage = 0;
    btnYes.textContent = yesTexts[0];
    btnYes.classList.remove('roaming');
    btnYes.removeAttribute('style');
  }

  btnYes.addEventListener('click', function(){
    yesStage++;
    if(yesStage < yesTexts.length){
      btnYes.textContent = yesTexts[yesStage];
      relocateYes();
    } else {
      resetYesButton();
      goPage('style');
    }
  });

  btnNo.addEventListener('click', function(){
    overlayNo.classList.add('show');
  });
  btnRetry.addEventListener('click', function(){
    overlayNo.classList.remove('show');
    resetYesButton();
  });

  /* ---------- 공용 단일 선택 + 취소 가능한 팝업 ---------- */
  var popupConfirm = document.getElementById('popup-confirm');
  var popupLabel = document.getElementById('popup-choice-label');

  function setupSingleSelect(gridEl, options, onConfirm){
    options.forEach(function(opt){
      var chip = document.createElement('button');
      chip.className = 'chip';
      chip.innerHTML = '<span class="emoji">'+opt.emoji+'</span><span>'+opt.label+'</span>';
      chip.addEventListener('click', function(){
        gridEl.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('selected'); });
        chip.classList.add('selected');
        popupLabel.textContent = opt.emoji+' '+opt.label;
        popupConfirm.classList.add('show');
        popupConfirm._pendingCancel = function(){ chip.classList.remove('selected'); };
        popupConfirm._pendingConfirm = function(){ onConfirm(opt); };
      });
      gridEl.appendChild(chip);
    });
  }

  document.getElementById('popup-confirm-btn').addEventListener('click', function(){
    popupConfirm.classList.remove('show');
    var fn = popupConfirm._pendingConfirm;
    popupConfirm._pendingConfirm = null; popupConfirm._pendingCancel = null;
    if(fn) fn();
  });
  document.getElementById('popup-cancel-btn').addEventListener('click', function(){
    popupConfirm.classList.remove('show');
    var fn = popupConfirm._pendingCancel;
    popupConfirm._pendingConfirm = null; popupConfirm._pendingCancel = null;
    if(fn) fn();
  });
  popupConfirm.addEventListener('click', function(e){
    if(e.target === popupConfirm){
      popupConfirm.classList.remove('show');
      var fn = popupConfirm._pendingCancel;
      popupConfirm._pendingConfirm = null; popupConfirm._pendingCancel = null;
      if(fn) fn();
    }
  });

  /* ---------- 데이트 스타일 ---------- */
  var styleOptions = [
    {emoji:'😌', label:'편안하게 힐링하는 데이트'},
    {emoji:'🔥', label:'빡세고 알차게 다니는 데이트'},
    {emoji:'⚽', label:'스포츠·액티비티 데이트'},
    {emoji:'🎨', label:'전시·공연 즐기는 데이트'},
    {emoji:'🚗', label:'드라이브 데이트'},
    {emoji:'📸', label:'감성 사진 데이트'},
    {emoji:'🛍️', label:'쇼핑하며 걷는 데이트'},
    {emoji:'🛋️', label:'집에서 뒹굴뒹굴 데이트'}
  ];
  var selectedStyle = null;
  setupSingleSelect(document.getElementById('style-grid'), styleOptions, function(opt){
    selectedStyle = opt;
    goPage('food');
  });

  /* ---------- 음식 선택 ---------- */
  var foodOptions = [
    {emoji:'🍚', label:'한식'},
    {emoji:'🍜', label:'중식'},
    {emoji:'🍣', label:'일식'},
    {emoji:'🍝', label:'양식'},
    {emoji:'🥩', label:'고기·구이'},
    {emoji:'🐟', label:'회'},
    {emoji:'🍱', label:'초밥'},
    {emoji:'🌶️', label:'마라탕·마라샹궈'},
    {emoji:'🍜', label:'쌀국수·아시안'},
    {emoji:'🍢', label:'샤브샤브·전골'},
    {emoji:'🍗', label:'치킨·야식'},
    {emoji:'🍔', label:'버거'},
    {emoji:'🌮', label:'멕시칸·타코'},
    {emoji:'🥘', label:'분식'},
    {emoji:'🍖', label:'곱창·막창'},
    {emoji:'🐷', label:'족발·보쌈'},
    {emoji:'🥩', label:'스테이크'},
    {emoji:'🦐', label:'해산물'},
    {emoji:'🍕', label:'피자·캐주얼'},
    {emoji:'🥞', label:'브런치'},
    {emoji:'🍰', label:'디저트·카페'},
    {emoji:'🍺', label:'술안주·포차'}
  ];
  var foodGrid = document.getElementById('food-grid');
  var btnDdanggyeo = document.getElementById('btn-ddanggyeo');
  var stickyCta = document.getElementById('sticky-cta');
  var selectedFoods = [];

  foodOptions.forEach(function(opt){
    var chip = document.createElement('button');
    chip.className = 'chip';
    chip.innerHTML = '<span class="emoji">'+opt.emoji+'</span><span>'+opt.label+'</span>';
    chip.addEventListener('click', function(){
      var idx = selectedFoods.indexOf(opt);
      if(idx===-1){ selectedFoods.push(opt); chip.classList.add('selected'); opt._chip = chip; }
      else { selectedFoods.splice(idx,1); chip.classList.remove('selected'); }
      btnDdanggyeo.disabled = selectedFoods.length===0;
    });
    foodGrid.appendChild(chip);
  });

  function sleep(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }

  var flyer = document.getElementById('flying-dragon');
  function positionFlyerTo(rect){
    flyer.style.left = (rect.left + rect.width/2 - 28)+'px';
    flyer.style.top = (rect.top + rect.height/2 - 28)+'px';
  }

  var thinkingEl = document.getElementById('thinking');
  var thinkingLabel = document.getElementById('thinking-label');
  var thinkingPhrases = ['고민하는 중...', '메뉴판 넘겨보는 중...', '저울질하는 중...', '냄새 맡아보는 중...'];
  var resultBox = document.getElementById('result-box');
  var foodPickText = document.getElementById('food-pick-text');
  var btnFoodReroll = document.getElementById('btn-food-reroll');

  btnDdanggyeo.addEventListener('click', function(){
    if(selectedFoods.length===0) return;
    runFoodPick();
  });

  async function runFoodPick(){
    btnDdanggyeo.disabled = true;
    btnDdanggyeo.textContent = '고르는 중...';
    document.querySelectorAll('#food-grid .chip').forEach(function(c){ c.style.pointerEvents='none'; });

    thinkingEl.scrollIntoView({behavior:'smooth', block:'center'});

    var startRect = btnDdanggyeo.getBoundingClientRect();
    positionFlyerTo(startRect);
    flyer.classList.add('show');
    await sleep(80);

    for(var i=0;i<selectedFoods.length;i++){
      var chip = selectedFoods[i]._chip;
      var r = chip.getBoundingClientRect();
      positionFlyerTo(r);
      await sleep(520);
      chip.classList.add('grabbed');
      await sleep(160);
    }

    var centerRect = {left: window.innerWidth/2 - 28, top: window.innerHeight/2 - 90, width:56, height:56};
    positionFlyerTo(centerRect);
    await sleep(520);

    thinkingLabel.textContent = thinkingPhrases[Math.floor(Math.random()*thinkingPhrases.length)];
    thinkingEl.classList.add('show');
    await sleep(1700);
    thinkingEl.classList.remove('show');

    var pick = selectedFoods[Math.floor(Math.random()*selectedFoods.length)];
    window.__finalFood = pick;
    foodPickText.textContent = pick.emoji+' '+pick.label+' 어때요?';
    btnFoodReroll.disabled = selectedFoods.length<=1;
    resultBox.classList.add('show');
    flyer.classList.remove('show');

    resultBox.scrollIntoView({behavior:'smooth', block:'center'});
    stickyCta.classList.add('hidden');
  }

  btnFoodReroll.addEventListener('click', function(){
    var choices = selectedFoods.filter(function(f){ return f!==window.__finalFood; });
    var pool = choices.length ? choices : selectedFoods;
    var pick = pool[Math.floor(Math.random()*pool.length)];
    window.__finalFood = pick;
    foodPickText.style.animation = 'none';
    void foodPickText.offsetWidth;
    foodPickText.style.animation = 'popIn .35s ease';
    foodPickText.textContent = pick.emoji+' '+pick.label+' 어때요?';
  });

  document.getElementById('btn-food-next').addEventListener('click', function(){
    goPage('time');
  });

  /* ---------- 시간 선택 ---------- */
  var timeOptions = [
    {emoji:'🌅', label:'오전 11시'},
    {emoji:'☀️', label:'오후 1시'},
    {emoji:'🌤️', label:'오후 3시'},
    {emoji:'🌇', label:'오후 5시'},
    {emoji:'🌙', label:'오후 7시'}
  ];
  var selectedTime = null;
  setupSingleSelect(document.getElementById('time-grid'), timeOptions, function(opt){
    selectedTime = opt;
    var s = selectedStyle || {emoji:'💕', label:'그냥 같이 있는 데이트'};
    var f = window.__finalFood || {emoji:'🍽️', label:'맛있는 거'};
    document.getElementById('recap').innerHTML =
      '이번 주 토요일 <b>'+opt.emoji+' '+opt.label+'</b><br><b>'+s.emoji+' '+s.label+'</b> 하면서<br><b>'+f.emoji+' '+f.label+'</b> 먹으러 가요!';
    goPage('final');
  });

  /* ---------- 결과 공유 ---------- */
  function buildShareText(){
    var t = selectedTime || {label:'토요일 언제든'};
    var s = selectedStyle || {emoji:'💕', label:'그냥 같이 있는 데이트'};
    var f = window.__finalFood || {emoji:'🍽️', label:'맛있는 거'};
    return '🐉💕 이번 주 토요일 '+t.label+'\n'+s.emoji+' '+s.label+' 하면서\n'+f.emoji+' '+f.label+' 먹으러 가요!\n\n(투슬리스의 데이트 신청서에서 골랐어요 🐉)';
  }

  var toast = document.getElementById('toast');
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toast.classList.remove('show'); }, 2800);
  }

  async function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
    }
    try{
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      return true;
    }catch(e){ return false; }
  }

  document.getElementById('btn-share').addEventListener('click', async function(){
    var text = buildShareText();
    if(navigator.share){
      try{ await navigator.share({title:'투슬리스와의 토요일 데이트', text:text}); return; }catch(e){}
    }
    var ok = await copyText(text);
    showToast(ok ? '복사했어요! 카톡 채팅방에 붙여넣기 해주세요 💌' : '공유에 실패했어요 😢 화면을 캡처해서 보내주세요');
  });

  /* ---------- 다시 보기 ---------- */
  document.getElementById('btn-replay').addEventListener('click', function(){
    location.reload();
  });

  /* ---------- 하트 & 컨페티 ---------- */
  var fxEl = document.getElementById('fx');
  var heartInterval = null;
  function spawnHeart(){
    var h = document.createElement('div');
    h.className='heart';
    h.textContent = Math.random()>0.5 ? '💕' : '💛';
    h.style.left = (Math.random()*90+5)+'%';
    h.style.animationDuration = (3.2+Math.random()*1.6)+'s';
    fxEl.appendChild(h);
    setTimeout(function(){ h.remove(); }, 5200);
  }
  function startHearts(){
    if(heartInterval) return;
    spawnHeart();
    heartInterval = setInterval(spawnHeart, 700);
  }
  function spawnConfettiBurst(){
    var colors = ['#ffd873','#ff9e6d','#8fd6f2','#f3c9d8','#ffffff'];
    for(var i=0;i<26;i++){
      var c = document.createElement('div');
      c.className='confetti';
      c.style.left = (44+Math.random()*12)+'%';
      c.style.top = '38%';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      var angle = Math.random()*Math.PI*2;
      var dist = 80+Math.random()*150;
      c.style.setProperty('--dx', (Math.cos(angle)*dist)+'px');
      c.style.setProperty('--dy', (Math.sin(angle)*dist - 60)+'px');
      c.style.setProperty('--rot', (Math.random()*360)+'deg');
      fxEl.appendChild(c);
      (function(el){ setTimeout(function(){ el.remove(); }, 950); })(c);
    }
  }

})();
</script>
</body>
</html>
